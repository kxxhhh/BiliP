name: 打包 .bpplugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 授予 Gradle 执行权限
        run: chmod +x gradlew

      # 关键：只编译 Kotlin 生成 class 文件，不打包 APK（节省大量时间）
      - name: 编译项目（生成插件所需的 class 文件）
        run: ./gradlew :app:compileDebugKotlin --no-daemon --no-watch-fs

      # 确保打包脚本可执行
      - name: 赋予打包脚本执行权限
        run: chmod +x package-emoji-bomb-plugin.sh

      # 执行你的打包脚本
      - name: 打包 .bpplugin
        run: ./package-emoji-bomb-plugin.sh

      # 上传产物
      - name: 上传 .bpplugin 包
        uses: actions/upload-artifact@v4
        with:
          name: emoji-bomb-plugin
          path: build/distributions/*.bpplugin
