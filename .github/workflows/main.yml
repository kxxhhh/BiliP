    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 设置 Java 环境（Kotlin 编译必须，建议使用 JDK 17 或 21）
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle # 开启缓存，下次编译速度会提升数倍

      # 2. 给 Gradle 脚本赋予执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 3. 编译并打包 Release 版本的 APK
      - name: Build Kotlin APK
        run: ./gradlew assembleRelease

      # 4. 将打包好的 APK 上传到 GitHub，方便你在网页端下载
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-android-apk
          path: '**/build/outputs/apk/release/*.apk' # 自动匹配打包输出目录
